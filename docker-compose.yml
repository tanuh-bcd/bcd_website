# # Usage:
# #   docker compose build
# #   docker compose up -d
# # Then open http://localhost:8080
services:
  backend:
    build:
      context: ./questionnaire-app
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # Beta research site intentionally shares the portal-dev public API/data.
      PORTAL_API_ORIGIN: ${PORTAL_API_ORIGIN:-https://bc-portal-dev.tanuh.ai}
      HOST: 0.0.0.0
    networks:
      - tanuhnet
    restart: always

  frontend:
    build:
      context: ./questionnaire-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_QUESTIONNAIRE_VERSION: ${VITE_QUESTIONNAIRE_VERSION:-}
        SKIP_FETCH: "1"
    container_name: frontend
    ports:
      - "3000:80" 
      # - "8080:80"                           # access at http://localhost:3000
    depends_on:
      - backend
    networks:
      - tanuhnet
    restart: always

networks:
  tanuhnet:
    driver: bridge
