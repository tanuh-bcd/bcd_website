# # Usage:
# #   docker compose build
# #   docker compose up -d
# # Then open http://localhost:8080
services:
  backend:
    build:
      context: ./questionnaire-app
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORTAL_API_ORIGIN: ${PORTAL_API_ORIGIN:?Set PORTAL_API_ORIGIN to the shared portal backend origin}
      HOST: 0.0.0.0
    networks:
      - tanuhnet
    restart: always

  frontend:
    # The portal publishes one tested image for both domains.
    image: ${SHARED_FRONTEND_IMAGE:?Set SHARED_FRONTEND_IMAGE to a tested immutable portal image}
    environment:
      SITE_MODE: research
    container_name: frontend
    ports:
      - "3000:80" 
      # - "8080:80"                           # access at http://localhost:3000
    depends_on:
      - backend
    networks:
      - tanuhnet
    restart: always

networks:
  tanuhnet:
    driver: bridge
